<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste API Getnet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #9c27b0;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #7b1fa2;
        }
        #resultado {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>Teste API Getnet</h1>
    <p>Clique no botão para testar a criação de link de pagamento:</p>
    
    <button onclick="testarAPI()">Criar Link de Pagamento (R$ 100,00)</button>
    
    <div id="resultado"></div>
    
    <script>
        async function testarAPI() {
            const resultado = document.getElementById('resultado');
            resultado.textContent = 'Processando...';
            
            try {
                console.log('Iniciando teste...');
                
                const response = await fetch('/api/create-payment-link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: 100,
                        description: 'Teste de Doação'
                    })
                });
                
                console.log('Status:', response.status);
                
                const data = await response.json();
                console.log('Resposta:', data);
                
                if (response.ok) {
                    resultado.textContent = 'Sucesso!\n\n' + JSON.stringify(data, null, 2);
                    
                    if (data.payment_url) {
                        resultado.innerHTML += `<br><br><a href="${data.payment_url}" target="_blank" style="color: #9c27b0; font-weight: bold;">Abrir Link de Pagamento</a>`;
                    }
                } else {
                    resultado.textContent = 'Erro!\n\n' + JSON.stringify(data, null, 2);
                }
                
            } catch (error) {
                console.error('Erro:', error);
                resultado.textContent = 'Erro: ' + error.message;
            }
        }
    </script>
</body>
</html>
